name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ platform folder is generated by Flutter, then copied in.
      # Package name becomes com.dramaflow.aistudio.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.dramaflow --project-name aistudio --platforms=android _gen
            cp -r _gen/android ./android
            rm -rf _gen
          fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dramaflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
