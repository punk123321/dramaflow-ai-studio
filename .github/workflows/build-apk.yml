name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'claude/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ platform folder is generated by Flutter, then copied in.
      # Package name becomes com.dramaflow.aistudio.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.dramaflow --project-name aistudio --platforms=android _gen
            cp -r _gen/android ./android
            rm -rf _gen
          fi

      # Ensure plugin artifacts are resolved from Google's Maven repository
      # and Maven Central as well as the Gradle Plugin Portal.
      - name: Configure Android plugin repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          if not p.exists():
              raise SystemExit("Generated android/settings.gradle.kts is missing")
          text = p.read_text()
          marker = "repositories {"
          if marker not in text:
              raise SystemExit("Could not find pluginManagement repositories block")
          start = text.index(marker) + len(marker)
          block_end = text.find("}", start)
          block = text[start:block_end]
          additions = []
          if "google()" not in block:
              additions.append("google()")
          if "mavenCentral()" not in block:
              additions.append("mavenCentral()")
          if additions:
              text = text[:start] + "\\n        ".join([""] + additions) + text[start:]
              p.write_text(text)
          print("Android plugin repositories verified.")
          PY

      # Our Android code (video picker). Replaces the template MainActivity.
      - name: Add native Android code
        run: |
          f=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          echo "Replacing $f"
          cp native/MainActivity.kt "$f"
          cp native/RenderEngine.kt "$(dirname "$f")/RenderEngine.kt"
          cp native/RenderService.kt "$(dirname "$f")/RenderService.kt"
          cp native/dramaflow.jks android/app/dramaflow.jks
          python3 native/patch_gradle.py android/app
          grep -n "dramaflow" android/app/build.gradle* | head
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO\|TTS_SERVICE\|INTERNET\|FOREGROUND_SERVICE\|RenderService\|WAKE_LOCK" android/app/src/main/AndroidManifest.xml

      # A plugin's lint check (video_player_android) crashes inside lint itself
      # on the current runner image. It is a check, not part of the app, so it
      # is switched off for the build.
      - name: Skip lintVital tasks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/skip-lint.gradle <<'EOF2'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital')) { t.enabled = false }
            }
          }
          EOF2

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          # main keeps the plain name; other branches get their own name so an
          # unreviewed branch build is never mistaken for the main build.
          name: ${{ github.ref_name == 'main' && 'dramaflow-apk' || format('dramaflow-apk-branch-{0}', github.run_number) }}
          path: build/app/outputs/flutter-apk/app-release.apk
          # The account's free Actions storage is small (0.5 GB), so branch builds expire quickly.
          retention-days: ${{ github.ref_name == 'main' && 14 || 3 }}
