name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'claude/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The android/ platform folder is generated by Flutter, then copied in.
      # Package name becomes com.dramaflow.aistudio.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --org com.dramaflow --project-name aistudio --platforms=android _gen
            cp -r _gen/android ./android
            rm -rf _gen
          fi

      # Our Android code (video picker). Replaces the template MainActivity.
      - name: Add native Android code
        run: |
          f=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          echo "Replacing $f"
          cp native/MainActivity.kt "$f"
          cp native/RenderEngine.kt "$(dirname "$f")/RenderEngine.kt"
          cp native/dramaflow.jks android/app/dramaflow.jks
          python3 native/patch_gradle.py android/app
          grep -n "dramaflow" android/app/build.gradle* | head
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO\|TTS_SERVICE\|INTERNET" android/app/src/main/AndroidManifest.xml

      # A plugin's lint check (video_player_android) crashes inside lint itself
      # on the current runner image. It is a check, not part of the app, so it
      # is switched off for the build.
      - name: Skip lintVital tasks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/skip-lint.gradle <<'EOF2'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital')) { t.enabled = false }
            }
          }
          EOF2

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          # main keeps the plain name; other branches get their own name so an
          # unreviewed branch build is never mistaken for the main build.
          name: ${{ github.ref_name == 'main' && 'dramaflow-apk' || format('dramaflow-apk-branch-{0}', github.run_number) }}
          path: build/app/outputs/flutter-apk/app-release.apk
