name: aistudio
description: DramaFlow AI Studio - personal drama recap and video production app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  sqflite: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Burmese font (optional, recommended). Put the .ttf in assets/fonts/ and
  # uncomment. Without it the app uses the phone's own Myanmar font.
  # fonts:
  #   - family: Noto Sans Myanmar
  #     fonts:
  #       - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
  #       - asset: assets/fonts/NotoSansMyanmar-Bold.ttf
  #         weight: 700
